
<!doctype html>
<html lang="en">
  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Cadastrar Produtos</title>
    <style>
        .form-control {
            max-width: 400px;
        }
        .btn {
            max-width: 400px;
        }
    </style>
  </head>
  <body>
    
    <br>
    <br>
    <div class="container">
        <a href="{% url 'listar_produtos_preco' %}" class="btn btn-secondary mb-3">Lista dos produtos já cadastrados >>></a>
        <br>
        <br>
        
        <form action="/stok/cadastrar_produto/" method="POST" enctype="multipart/form-data"> {% csrf_token %}

            <label for="">Marca</label>
                <select class="form-control" name="marca">
                    <option value="volkswagen">Volkswagen</option>
                    <option value="hyundai">Hyundai</option>
                    <option value="nissan">Nissan</option>
                    <option value="toyota">Toyota</option>
                    <option value="chevrolet">Chevrolet</option>
                    <option value="fiat">Fiat</option>
                    <option value="byd">BYD</option>
                </select>
                <br>
                <br>
                <label for="">Modelo</label>
                <input class="form-control" type="text" name="modelo" id="">
                <br>
                <br>
                <label for="">Ano de Fabricação</label>
                <input class="form-control" type="number" name="ano_fabricacao">
                <br>
                <br>
                <label for="">Preço</label>
                <input class="form-control" type="number" step="0.01" name="preco">
                <br>
                <br>
                <label for="">Tipo</label>
                <select class="form-control" name="tipo">
                    <option value="eletrico">Elétrico</option>
                    <option value="hibrido">Híbrido</option>
                    <option value="combustao">Combustão</option>
                </select>
                <br>
                <br>
                <label for="">Estado de Conservação</label>
                <select class="form-control" name="estado">
                    <option value="boa">Boa</option>
                    <option value="excelente">Excelente</option>
                    <option value="medio">Médio</option>
                </select>
                <br>
                <br>
                <label for="">Cor</label>
                <input class="form-control" type="text" name="cor">
                <br>
                <br>
                <label for="">Foto do Veículo</label>
                <input class="form-control" type="file" name="foto" accept="image/jpeg">
                <br>
                <br>
                <input class="btn btn-success" type="submit" value="cadastrar">
           
''            </form>

<br>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>



  </body>
</html>
