<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Cadastrar Produtos</title>
    <style>
        .form-control, .btn { max-width: 400px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <a href="{% url 'listar_produtos_preco' %}" class="btn btn-secondary mb-3">Lista dos produtos já cadastrados >>></a>
        
        <form action="/stok/cadastrar_produto/" method="POST"> {% csrf_token %}

            <label>Marca</label>
            <select class="form-control" name="marca">
                <option value="volkswagen">Volkswagen</option>
                <option value="hyundai">Hyundai</option>
                <option value="nissan">Nissan</option>
                <option value="toyota">Toyota</option>
                <option value="chevrolet">Chevrolet</option>
                <option value="fiat">Fiat</option>
                <option value="byd">BYD</option>
            </select>
            <br>

            <label>Modelo</label>
            <input class="form-control" type="text" name="modelo">
            <br>

            <label>Ano de Fabricação</label>
            <input class="form-control" type="date" name="ano_fabricacao">
            <br>
            <label>KM Rodado</label>
            <input class="form-control mask-km" type="text" name="quilometragem" placeholder="0">
            <br>

            <label>Preço</label>
            <input class="form-control mask-money" type="text" name="preco" placeholder="0,00">
            <br>

            <label>Tipo</label>
            <select class="form-control" name="tipo">
                <option value="eletrico">Elétrico</option>
                <option value="hibrido">Híbrido</option>
                <option value="combustao">Combustão</option>
            </select>
            <br>

            <label>Estado de Conservação</label>
            <select class="form-control" name="estado">
                <option value="boa">Boa</option>
                <option value="excelente">Excelente</option>
                <option value="medio">Médio</option>
            </select>
            <br>

            <label>Cor</label>
            <input class="form-control" type="text" name="cor">
            <br>

            <input class="btn btn-success" type="submit" value="cadastrar">
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function(){
            // Esta máscara permite valores como 1.500,00 ou 50.000,00
            $('.mask-money').mask('#.##0,00', {reverse: true});
            $('.mask-km').mask('#.##0', {reverse: true}); // Máscara para milhares
        });

    </script>

</body>
</html>
